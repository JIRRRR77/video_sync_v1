name: Deploy birthday gift to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'birthday-gift/**'
      - '.github/workflows/deploy-birthday.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        # Enable Pages with Source = GitHub Actions in repository settings first.
        # The built-in GITHUB_TOKEN cannot enable a new Pages site by itself.
      - name: Validate and build the birthday website
        working-directory: birthday-gift
        run: |
          npm run check
          npm run build
          test -s dist/index.html
      - name: Upload only the website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: birthday-gift/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the birthday website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
